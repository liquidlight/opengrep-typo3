rules:
  - id: typo3-recaptcha-secret-committed
    languages: [regex]
    severity: ERROR
    message: >-
      A reCAPTCHA secret key is committed. Anyone with the repository can use it to pass the CAPTCHA
      check. Create a new key in the reCAPTCHA admin console and read it from the environment
      (Infisical) instead.
    metadata:
      category: security
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
    patterns:
      - pattern-regex: private_key['"]?\s*(=>|=)\s*['"]?6L[0-9A-Za-z_-]{38}
      # Google's documented test key, which always passes
      - pattern-not-regex: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe

  - id: typo3-encryption-key-committed
    languages: [regex]
    severity: INFO
    paths:
      include: ["config/system/*.php", "*/LocalConfiguration.php", "*/AdditionalConfiguration.php"]
    message: >-
      The TYPO3 encryption key is committed, so anyone with the repository can sign form state,
      Extbase trusted properties and cHash values that the site will accept. Read it from the
      TYPO3_ENCRYPTION_KEY environment variable (Infisical) and generate a new key.
    metadata:
      category: security
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
    pattern-regex: encryptionKey['"]\]?\s*(=>|=)\s*['"][0-9a-f]{32,}['"]
