<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<!-- ruleid: typo3-fluid-raw-in-attribute -->
<a href="#" data-config="{link.config -> f:format.raw()}">Link</a>

<!-- ok: typo3-fluid-raw-in-attribute -->
<input type="search" name="tx_kesearch_pi1[sword]" value="{searchword -> f:format.raw()}" />

<!-- ruleid: typo3-fluid-variable-in-event-handler -->
<button onclick="go('{item.slug}')">Go</button>

<!-- ok: typo3-fluid-variable-in-event-handler -->
<f:form action="login" onsubmit="{onSubmit}">

<script>
	var config = {
		// ruleid: typo3-fluid-raw-inside-script
		style: '{settings.mapStyle -> f:format.raw()}',
		// ok: typo3-fluid-raw-inside-script
		items: {items -> f:format.json() -> f:format.raw()}
	};
</script>

<!-- ruleid: typo3-fluid-htmlentities-decode -->
<f:format.htmlentitiesDecode>{newsItem.title}</f:format.htmlentitiesDecode>

<!-- ok: typo3-fluid-raw-on-plain-text-field -->
<p>{data.bodytext -> f:format.raw()}</p>

<!-- ruleid: typo3-fluid-raw-on-plain-text-field -->
<h2>{data.header -> f:format.raw()}</h2>

<!-- ok: typo3-fluid-raw-on-plain-text-field -->
<h2><f:format.raw>{resultrow.title}</f:format.raw></h2>

<!-- ruleid: typo3-fluid-debug-output -->
<f:debug>{_all}</f:debug>

</html>
