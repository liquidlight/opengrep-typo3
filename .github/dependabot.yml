# Keeps the pinned actions and the Dockerfile's base images up to date.
# OPENGREP_VERSION and the community rules commit are updated by hand (see the README).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
